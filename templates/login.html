<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GuestBook Login</title>
</head>
<body style="margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(to right, #f8f9fa, #e9ecef); height: 100vh; display: flex; justify-content: center; align-items: center;">

    <div style="background-color: #ffffff; padding: 40px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1); width: 100%; max-width: 350px;">
        <h2 style="text-align: center; color: #333333; margin-bottom: 30px;">GuestBook Login</h2>

        <form action="/" method="post">
            <label for="email" style="display: block; margin-bottom: 8px; font-weight: 600;">Email</label>
            <input type="text" id="email" name="email" placeholder="Enter your email" required
                style="width: 100%; padding: 10px 12px; border: 1px solid #ccc; border-radius: 5px; margin-bottom: 20px; box-sizing: border-box;">

            <input type="submit" value="Login"
                style="width: 100%; padding: 10px; background-color: #007bff; color: white; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; transition: background 0.3s;">
        </form>
    </div>

</body>
</html>
